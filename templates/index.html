<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driver Drowsiness Detection</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #0d1117;
            font-family: 'Poppins', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 20px;
            font-size: 32px;
            font-weight: 700;
            color: #58a6ff;
            letter-spacing: 1px;
        }

        #video-container {
            margin-top: 30px;
            width: 720px;
            height: 520px;
            border: 3px solid #58a6ff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 153, 255, 0.6);
            background: #000;
        }

        #video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #controls {
            margin-top: 25px;
            display: flex;
            gap: 20px;
        }

        button {
            padding: 12px 28px;
            font-size: 18px;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            color: #fff;
            transition: 0.3s ease;
        }

        #start-btn {
            background: #2ea043;
        }

        #start-btn:hover {
            background: #3fb950;
        }

        #stop-btn {
            background: #da3633;
        }

        #stop-btn:hover {
            background: #ff4d4a;
        }

        #status-box {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 22px;
            font-weight: 600;
            color: #fff;
            background: #161b22;
            border-radius: 10px;
            border: 2px solid #30363d;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
    </style>

    <script>
        function startCamera() {
            fetch("/start_camera", { method: "POST" })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "started" || data.status === "already_running") {
                        const img = document.getElementById("video-feed");

                        // 🔥 Force browser to request MJPEG stream
                        img.src = "/video_feed?" + new Date().getTime();

                        document.getElementById("status-box").innerText = "Camera: ON";
                    } else {
                        alert("❌ Camera could not start");
                    }
                })
                .catch(err => {
                    alert("❌ Server error");
                    console.error(err);
                });
        }

        function stopCamera() {
            fetch("/stop_camera", { method: "POST" })
                .then(() => {
                    document.getElementById("video-feed").src = "";
                    document.getElementById("status-box").innerText = "Camera: OFF";
                })
                .catch(err => console.error(err));
        }
    </script>
</head>

<body>

    <h1>Driver Drowsiness Detection System</h1>

    <div id="video-container">
        <img id="video-feed" alt="Camera Stream">
    </div>

    <div id="controls">
        <button id="start-btn" onclick="startCamera()">Start Detection</button>
        <button id="stop-btn" onclick="stopCamera()">Stop Detection</button>
    </div>

    <div id="status-box">Camera: OFF</div>

</body>
</html>
