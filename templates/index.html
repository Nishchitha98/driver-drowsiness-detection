<!DOCTYPE html>
<html>
<head>
    <title>Driver Drowsiness Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin-top: 30px;
        }

        #video-container {
            margin-top: 20px;
        }

        video, img {
            width: 640px;
            height: 480px;
            border: 3px solid #00eaff;
            border-radius: 10px;
        }

        button {
            font-size: 18px;
            padding: 12px 22px;
            margin: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #startBtn { background-color: #28a745; color: white; }
        #startBtn:disabled { background-color: #1d5f2b; }

        #stopBtn { background-color: #dc3545; color: white; }
        #stopBtn:disabled { background-color: #742027; }

        #status {
            margin-top: 10px;
            font-size: 20px;
            color: #00eaff;
        }
    </style>
</head>
<body>

    <h1>Driver Drowsiness Detection</h1>

    <div id="controls">
        <button id="startBtn" onclick="startCamera()">Start Camera</button>
        <button id="stopBtn" onclick="stopCamera()" disabled>Stop Camera</button>
    </div>

    <h2 id="status">Camera Status: Stopped</h2>

    <div id="video-container">
        <img id="videoFeed" src="" style="display:none;">
    </div>

    <script>
        function startCamera() {
            fetch('/start_camera', {method: 'POST'})
            .then(() => {
                document.getElementById("videoFeed").src = "/video_feed";
                document.getElementById("videoFeed").style.display = "block";
                document.getElementById("startBtn").disabled = true;
                document.getElementById("stopBtn").disabled = false;
                document.getElementById("status").innerText = "Camera Status: Running";
            });
        }

        function stopCamera() {
            fetch('/stop_camera', {method: 'POST'})
            .then(() => {
                document.getElementById("videoFeed").style.display = "none";
                document.getElementById("videoFeed").src = "";
                document.getElementById("startBtn").disabled = false;
                document.getElementById("stopBtn").disabled = true;
                document.getElementById("status").innerText = "Camera Status: Stopped";
            });
        }
    </script>

</body>
</html>
